<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Neverness to Everness</title>
  <meta name="description" content="Enter the cyberpunk anime world of Neverness to Everness.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <img class="header-logo" src="logos/logo%20(1).png" alt="Neverness to Everness">
  </header>

  <main class="hero">
    <video class="hero-video" autoplay muted playsinline poster="images/image-Neverness-to-Everness-1.jpeg">
<source src="videos/vedio-Neverness-to-Everness-1.mp4" type="video/mp4">    </video>

    <div class="hero-shade"></div>
    <div class="scanline" aria-hidden="true"></div>

    <section class="hero-content">
      <div class="hero-copy">
        <p class="tag">Cyberpunk anime open-world RPG</p>
        <h1>Neon anomalies await</h1>
        <p class="description">Explore a futuristic anime world, meet stylish characters, and uncover supernatural secrets in Neverness to Everness.</p>
        <a class="cta" href="#" id="mainCta">Claim Access</a>
        <p class="platform-note">Windows Only</p>
      </div>

      <div class="hero-preview" aria-label="Neverness to Everness rotating preview">
        <img id="rotatingImage" src="images/image-Neverness-to-Everness-1.jpeg" alt="Neverness to Everness preview">
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
